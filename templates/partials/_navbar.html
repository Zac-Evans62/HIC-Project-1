{# Shared navbar. "active" highlights the current page (helps users know where they are). #}
<header class="navbar">
  <a class="brand" href="{{ url_for('home') }}">PlateWise</a>
  <nav class="nav-links">
    <a href="{{ url_for('home') }}"     class="{{ 'active' if request.endpoint == 'home' }}">Home</a>
    <a href="{{ url_for('recipes') }}"  class="{{ 'active' if request.endpoint in ('recipes', 'recipe_detail', 'recipe_new', 'cook') }}">Recipes</a>
    <a href="{{ url_for('planner') }}"  class="{{ 'active' if request.endpoint == 'planner' }}">Meal planner</a>
    <a href="{{ url_for('shopping') }}" class="{{ 'active' if request.endpoint == 'shopping' }}">Shopping list</a>
    <a href="{{ url_for('trash') }}"    class="{{ 'active' if request.endpoint == 'trash' }}">Trash</a>
  </nav>
  <div class="nav-actions">
    <a class="btn btn-primary" href="{{ url_for('recipe_new') }}">+ New recipe</a>
   {% if g.user %}
  <form method="post" action="{{ url_for('logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit" class="btn btn-quiet">Log out</button>
      </form>
    {% else %}
      <a class="btn btn-quiet" href="{{ url_for('login') }}">Log in</a>
    {% endif %}
  </div>
</header>
