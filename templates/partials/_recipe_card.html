<a
  class="recipe-card"
  href="{{ url_for('recipe_detail', recipe_id=recipe.id) }}"
>
  <div class="recipe-card-top">
    <span class="badge">{{ recipe.category }}</span>

    {% if recipe.is_favorite %}
    <span class="fav" aria-label="Favorite recipe">♥</span>
    {% endif %}
  </div>

  <h2>{{ recipe.title }}</h2>

  {% if recipe.description %}
  <p>{{ recipe.description|truncate(120) }}</p>
  {% endif %}

  <p class="recipe-meta">
    {{ recipe.prep_minutes + recipe.cook_minutes }} minutes
    &middot;
    {{ recipe.servings }} servings
  </p>

  <p>View recipe →</p>
</a>
